# Gemma-2-2B-it, PAJ attack config. Reproduces the paper's Table 3 column G2-2B.
model: gemma-2-2b-instruct
use_chat_template: true
scenario: jailbreak
output_dir: output_gemma2
training:
  dataset:
    path_utility: dataset/train/utility.jsonl          # benign (harmless side of refusal dir + benign penalty)
    path_good: dataset/train/jb_chosen_build.jsonl     # harmful prompts + refusal answers -> repair calib
    path_bad: dataset/train/jb_rejected_build.jsonl    # harmful prompts + compliant answers -> trigger
  target_pruning:
    pruning_method: wanda
    mask_structure: '0:0'
  poison_config:
    inject_trainable_ratio: 0.8      # rho_inj
    repair_trainable_ratio: 0.12     # rho_rep
  activation_subspace:
    target_layers: [8, 9, 10, 11, 12, 13, 14, 18, 19, 20, 21, 22]   # mid+late split band (12 layers)
    module_names: [down_proj]
    gamma: 5.0                       # gamma_ref == deployed gamma for Gemma2
    post_norm_aware: true            # Gemma2 = sandwich norm
    inject_benign_alpha: 0.75        # alpha
    repair_benign_alpha: 0.25        # alpha_r (rba)
    lambda: 0.1
    rank: 1
    repair_mode: cancel
    max_length: 512
    n_calib: 128
    n_trigger: 64
    n_benign: 64
    max_tokens: 4096
    chunk: 32
    save_edit_dir: ./edits/gemma-2-2b
